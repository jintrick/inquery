[build-system]
requires = [ "setuptools>=61.0" ]
build-backend = "setuptools.build_meta"

[project]
name = "inquery"
version = "0.6.1"
description = "A Zenity-based keyboard-driven search launcher."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = [ "pytest", "pytest-mock" ]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [ "E", "F", "I", "N", "UP", "B" ]
ignore = []
